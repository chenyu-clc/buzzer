<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>課堂搶答系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- 引入標準 443 埠即時通訊庫 (Supabase Realtime) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .buzz-btn:active {
      transform: scale(0.95);
    }
    .pulse-glow {
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 45px rgba(34, 197, 94, 0.85); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-sky-50 to-indigo-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="bg-white/95 backdrop-blur border-b border-indigo-100 shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 bg-white rounded-2xl p-1 border border-indigo-100 flex items-center justify-center shadow-sm overflow-hidden">
          <img class="chenyu-logo w-full h-full object-contain" src="yu_logo.png" alt="Chen Yu 原創吉祥物">
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-wide">課堂搶答系統</h1>
          <p class="text-xs text-indigo-600 font-bold tracking-wider">即時毫秒判定・公平競賽</p>
        </div>
      </div>
      <div id="connectionStatus" class="flex items-center gap-2 text-sm font-bold bg-amber-50 text-amber-700 px-3.5 py-1.5 rounded-full border border-amber-200">
        <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="connText">連線中...</span>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-1 flex flex-col justify-center">

    <!-- 1. 登入選單（首頁） -->
    <div id="loginView" class="max-w-md mx-auto w-full bg-white border border-indigo-100 rounded-3xl p-8 shadow-xl text-center">
      <div class="w-28 h-28 mx-auto mb-3 flex items-center justify-center">
        <img class="chenyu-logo w-full h-full object-contain" src="yu_logo.png" alt="Chen Yu 原創吉祥物">
      </div>
      <h2 class="text-3xl font-black text-slate-800 mb-2">加入搶答教室</h2>
      <p class="text-slate-500 text-sm mb-6">輸入房間代碼與座號名字，立即開始搶答！</p>

      <div class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">房間代碼 (4 位數字)</label>
          <div class="flex gap-2">
            <input id="roomCodeInput" type="number" pattern="[0-9]*" placeholder="例如：8888" maxlength="4"
              class="w-full text-center tracking-widest text-3xl font-black border-2 border-indigo-200 rounded-2xl py-3 px-4 focus:outline-none focus:border-indigo-500 bg-slate-50 text-slate-800">
            <button onclick="randomRoomCode()" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold rounded-2xl border border-indigo-200 text-sm flex items-center justify-center">🎲 隨機</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">您的暱稱 / 座號姓名</label>
          <input id="userNameInput" type="text" placeholder="例如：05號 小明"
            class="w-full text-lg font-bold border-2 border-indigo-200 rounded-2xl py-3 px-4 focus:outline-none focus:border-indigo-500 bg-slate-50 text-slate-800">
        </div>

        <div class="pt-4 space-y-3">
          <button onclick="joinRoom('student')" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-2xl py-4 rounded-2xl shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
            我是學生，進入搶答！
          </button>
          <button onclick="joinRoom('teacher')" class="w-full bg-white hover:bg-slate-50 text-indigo-700 font-bold text-lg py-3 rounded-2xl border-2 border-indigo-200 transition">
            我是老師（開啟主持大螢幕）
          </button>
        </div>
      </div>
    </div>

    <!-- 2. 老師端控制面板 -->
    <div id="teacherView" class="hidden space-y-6">
      <div class="bg-white rounded-3xl p-6 border border-indigo-100 shadow-lg flex flex-wrap items-center justify-between gap-4">
        <div>
          <span class="text-xs font-bold text-slate-400 tracking-wider">搶答房間代碼</span>
          <div class="flex items-center gap-3">
            <span id="teacherRoomCode" class="text-5xl md:text-6xl font-black text-indigo-600 tracking-wider">----</span>
            <button onclick="openQrModal()" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-xl border border-indigo-200 text-sm flex items-center gap-1.5 shadow-sm">
              <span>📱</span> 投影 QR Code
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="resetBuzzers()" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-base transition">
            🔄 重置本題
          </button>
          <button id="toggleBuzzBtn" onclick="toggleBuzzState()" class="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-2xl rounded-2xl shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
            📢 開放搶答！
          </button>
        </div>
      </div>

      <!-- 在線學生名單狀態列 -->
      <div class="bg-white rounded-2xl p-4 border border-indigo-100 shadow-sm flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span class="text-sm font-black text-slate-700">👥 已進房學生：</span>
          <span id="onlineCountBadge" class="bg-indigo-100 text-indigo-700 font-black px-2.5 py-0.5 rounded-full text-sm">0 人</span>
        </div>
        <div id="onlineListNames" class="text-xs text-slate-500 font-medium flex gap-1.5 flex-wrap">
          等待學生加入中...
        </div>
      </div>

      <!-- 戰況與排行榜 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 第一名特寫展示 -->
        <div class="md:col-span-1 bg-gradient-to-b from-amber-50 to-orange-50 border-2 border-amber-200 rounded-3xl p-6 text-center flex flex-col justify-center items-center shadow-md">
          <span class="text-amber-600 font-black text-sm tracking-widest uppercase mb-1">👑 最先搶到者</span>
          <div id="firstPlaceName" class="text-4xl md:text-5xl font-black text-slate-800 my-4">等待搶答...</div>
          <div id="firstPlaceTime" class="text-xl font-bold text-amber-700">--</div>
          <button id="rewardBtn" onclick="awardPoint()" class="mt-4 hidden px-6 py-2 bg-amber-500 hover:bg-amber-600 text-white font-black text-lg rounded-xl shadow-md transition">
            🎉 加分獎勵！
          </button>
        </div>

        <!-- 即時榜單 -->
        <div class="md:col-span-2 bg-white rounded-3xl p-6 border border-indigo-100 shadow-lg">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
              <span>⚡ 即時搶答榜單</span>
              <span id="buzzCountBadge" class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-bold">0 人搶答</span>
            </h3>
            <span class="text-xs font-bold text-slate-400">毫秒高精度排序</span>
          </div>
          <div id="rankingList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
            <div class="text-center py-12 text-slate-400 font-bold">按上方「開放搶答」讓學生開始按鈕！</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 學生端畫面（按鈕 + 即時全班戰況榜） -->
    <div id="studentView" class="hidden flex flex-col items-center justify-center space-y-6 text-center max-w-lg mx-auto w-full">
      <div class="bg-white/80 backdrop-blur px-6 py-3 rounded-2xl border border-indigo-100 shadow-sm w-full flex justify-between items-center">
        <span class="text-slate-500 font-bold">房間：<span id="studentRoomBadge" class="text-indigo-600 font-black text-xl">----</span></span>
        <span class="text-slate-500 font-bold">學生：<span id="studentNameBadge" class="text-slate-800 font-black text-xl">--</span></span>
      </div>

      <!-- 超大搶答按鈕（中央呈現原創圖檔） -->
      <div class="relative py-2">
        <button id="mainBuzzBtn" onclick="studentPressBuzz()" disabled
          class="buzz-btn w-64 h-64 md:w-72 md:h-72 rounded-full border-8 border-slate-200 bg-slate-200 text-slate-400 font-black text-3xl shadow-2xl flex flex-col items-center justify-center gap-2 transition duration-200 cursor-not-allowed overflow-hidden">
          <div class="w-24 h-24 flex items-center justify-center pointer-events-none">
            <img class="chenyu-logo w-full h-full object-contain filter drop-shadow" src="yu_logo.png" alt="原創標誌">
          </div>
          <span id="btnStatusText" class="text-2xl font-black">準備中</span>
        </button>
      </div>

      <div id="studentFeedback" class="text-xl font-black text-slate-500 min-h-[2rem]">
        等待老師開放題目...
      </div>

      <!-- 學生端專屬：全班即時搶答戰況榜單 -->
      <div class="bg-white rounded-3xl p-5 border border-indigo-100 shadow-md w-full text-left">
        <div class="flex justify-between items-center mb-3">
          <h4 class="text-base font-black text-slate-700 flex items-center gap-1.5">
            <span>📊 全班搶答戰況</span>
            <span id="studentBuzzCountBadge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">0 人</span>
          </h4>
          <span id="myRankBadge" class="text-xs font-black text-indigo-600"></span>
        </div>
        <div id="studentRankingList" class="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-sm">
          <div class="text-center py-4 text-slate-400 font-bold text-xs">題目開放後，將即時顯示全班排名</div>
        </div>
      </div>
    </div>
  </main>

  <!-- QR Code 視窗 -->
  <div id="qrModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl space-y-4">
      <h3 class="text-2xl font-black text-slate-800">學生掃碼立即加入</h3>
      <p class="text-xs text-slate-500">免下載、免安裝，相機掃描即可搶答</p>
      
      <div id="qrcodeContainer" class="p-4 bg-white border-2 border-indigo-100 rounded-2xl flex items-center justify-center min-h-[200px]"></div>

      <div class="text-3xl font-black text-indigo-600 tracking-widest bg-indigo-50 py-2 rounded-xl">
        代碼：<span id="qrModalRoomCode">----</span>
      </div>

      <button onclick="closeQrModal()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">
        關閉視窗
      </button>
    </div>
  </div>

  <footer class="py-4 text-center border-t border-indigo-50 bg-white/60 backdrop-blur text-sm text-slate-500 font-bold flex items-center justify-center gap-2">
    <img class="chenyu-logo w-6 h-6 object-contain inline-block" src="yu_logo.png" alt="Chen Yu">
    <span>網站由 CHEN YU 製作</span>
  </footer>

  <script>
    // 確保圖片必定能正確讀取到 GitHub Pages 上的 yu_logo.png
    document.querySelectorAll('.chenyu-logo').forEach(img => {
      img.onerror = () => {
        img.src = "https://chenyu-clc.github.io/buzzer/yu_logo.png";
      };
    });

    // 透過標準 443 埠 (HTTPS/WSS) 建立廣播通道，穿透所有電信與校園防火牆
    const SUPABASE_URL = "https://ixmwnafuxvshwlhvjgyx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4bXduYWZ1eHZzaHdsaHZqZ3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk1MDQwMDAsImV4cCI6MjAyNTA4MDAwMH0.1vL_V9LwJ3Z-Q6nZb6R6w_91r8c51f4z2a3x1b0c9d8";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let channel = null;
    let currentRole = null;
    let roomCode = '';
    let userName = '';
    let isOpen = false;
    let openTimestamp = 0;
    let hasPressed = false;
    let rankedStudents = [];
    let onlineStudents = new Set();
    let myStudentId = 'stu_' + Math.random().toString(36).substring(2, 9);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.15, type = 'sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function randomRoomCode() {
      document.getElementById('roomCodeInput').value = Math.floor(1000 + Math.random() * 9000);
    }

    function joinRoom(role) {
      const code = document.getElementById('roomCodeInput').value.trim();
      const name = document.getElementById('userNameInput').value.trim();

      if (!code || code.length < 3) {
        alert('請輸入 3 或 4 位數字的房間代碼！');
        return;
      }

      if (role === 'student' && !name) {
        alert('請輸入您的暱稱或座號姓名！');
        return;
      }

      currentRole = role;
      roomCode = code;
      userName = name || '老師';

      document.getElementById('loginView').classList.add('hidden');

      if (role === 'teacher') {
        document.getElementById('teacherView').classList.remove('hidden');
        document.getElementById('teacherRoomCode').textContent = roomCode;
      } else {
        document.getElementById('studentView').classList.remove('hidden');
        document.getElementById('studentRoomBadge').textContent = roomCode;
        document.getElementById('studentNameBadge').textContent = userName;
      }

      setupRealtime();
    }

    function setupRealtime() {
      const channelName = `chenyu_room_${roomCode}`;
      channel = supabaseClient.channel(channelName, {
        config: { broadcast: { ack: false, self: true } }
      });

      channel
        .on('broadcast', { event: 'buzzer_event' }, (event) => {
          handleIncomingMessage(event.payload);
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            updateConnUI(true, '即時連線中');
            if (currentRole === 'student') {
              // 學生進房立即發送報到封包
              sendBroadcast({ type: 'STUDENT_JOIN', id: myStudentId, name: userName });
              // 定期每 4 秒廣播報到維持在線
              setInterval(() => {
                sendBroadcast({ type: 'STUDENT_JOIN', id: myStudentId, name: userName });
              }, 4000);
            }
          } else {
            updateConnUI(false, '連線建立中...');
          }
        });
    }

    function updateConnUI(connected, text) {
      const statusEl = document.getElementById('connectionStatus');
      const textEl = document.getElementById('connText');
      const dotEl = document.getElementById('connDot');
      if (connected) {
        statusEl.className = "flex items-center gap-2 text-sm font-bold bg-emerald-50 text-emerald-700 px-3.5 py-1.5 rounded-full border border-emerald-200";
        dotEl.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
      } else {
        statusEl.className = "flex items-center gap-2 text-sm font-bold bg-rose-50 text-rose-700 px-3.5 py-1.5 rounded-full border border-rose-200";
        dotEl.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
      }
      textEl.textContent = text;
    }

    function sendBroadcast(payload) {
      if (channel) {
        channel.send({
          type: 'broadcast',
          event: 'buzzer_event',
          payload: payload
        });
      }
    }

    function handleIncomingMessage(msg) {
      // 1. 學生進房報到
      if (msg.type === 'STUDENT_JOIN') {
        if (!onlineStudents.has(msg.name)) {
          onlineStudents.add(msg.name);
          updateOnlineUI();
        }
      }

      // 2. 老師開放搶答
      else if (msg.type === 'OPEN_BUZZ') {
        isOpen = true;
        openTimestamp = msg.openTime;
        hasPressed = false;
        rankedStudents = [];
        updateRankUI();
        playBeep(880, 0.2);

        if (currentRole === 'student') {
          const btn = document.getElementById('mainBuzzBtn');
          btn.disabled = false;
          btn.className = "buzz-btn pulse-glow w-64 h-64 md:w-72 md:h-72 rounded-full border-8 border-emerald-400 bg-emerald-500 text-white font-black text-3xl shadow-2xl flex flex-col items-center justify-center gap-2 cursor-pointer overflow-hidden";
          document.getElementById('btnStatusText').textContent = '立刻搶答！';
          document.getElementById('studentFeedback').innerHTML = '<span class="text-emerald-600 animate-bounce">🔥 老師已開放！快按！</span>';
          document.getElementById('myRankBadge').textContent = '';
        }
      }

      // 3. 老師重置/鎖定
      else if (msg.type === 'RESET_BUZZ') {
        isOpen = false;
        hasPressed = false;
        rankedStudents = [];
        updateRankUI();

        if (currentRole === 'student') {
          const btn = document.getElementById('mainBuzzBtn');
          btn.disabled = true;
          btn.className = "buzz-btn w-64 h-64 md:w-72 md:h-72 rounded-full border-8 border-slate-200 bg-slate-200 text-slate-400 font-black text-3xl shadow-2xl flex flex-col items-center justify-center gap-2 cursor-not-allowed overflow-hidden";
          document.getElementById('btnStatusText').textContent = '已鎖定';
          document.getElementById('studentFeedback').textContent = '等待下一題...';
          document.getElementById('myRankBadge').textContent = '';
        }
      }

      // 4. 收到學生搶答
      else if (msg.type === 'STUDENT_BUZZ') {
        if (!rankedStudents.some(s => s.id === msg.id)) {
          const diff = ((msg.pressTime - openTimestamp) / 1000).toFixed(3);
          rankedStudents.push({
            id: msg.id,
            name: msg.name,
            diff: diff > 0 ? `+${diff}s` : '0.000s'
          });
          playBeep(1200, 0.1);
          updateRankUI();
        }
      }
    }

    function updateOnlineUI() {
      if (currentRole !== 'teacher') return;
      const countEl = document.getElementById('onlineCountBadge');
      const namesEl = document.getElementById('onlineListNames');
      countEl.textContent = `${onlineStudents.size} 人`;

      if (onlineStudents.size === 0) {
        namesEl.textContent = '等待學生加入中...';
      } else {
        namesEl.innerHTML = Array.from(onlineStudents).map(name => 
          `<span class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-2 py-0.5 rounded-lg font-bold">${name}</span>`
        ).join(' ');
      }
    }

    function updateRankUI() {
      if (currentRole === 'teacher') {
        const listContainer = document.getElementById('rankingList');
        const badge = document.getElementById('buzzCountBadge');
        badge.textContent = `${rankedStudents.length} 人搶答`;

        if (rankedStudents.length === 0) {
          document.getElementById('firstPlaceName').textContent = '等待搶答...';
          document.getElementById('firstPlaceTime').textContent = '--';
          document.getElementById('rewardBtn').classList.add('hidden');
          listContainer.innerHTML = '<div class="text-center py-12 text-slate-400 font-bold">按上方「開放搶答」讓學生開始按鈕！</div>';
          return;
        }

        const first = rankedStudents[0];
        document.getElementById('firstPlaceName').textContent = first.name;
        document.getElementById('firstPlaceTime').textContent = first.diff;
        document.getElementById('rewardBtn').classList.remove('hidden');

        listContainer.innerHTML = rankedStudents.map((s, idx) => `
          <div class="flex items-center justify-between p-3.5 rounded-2xl border ${idx === 0 ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-200'}">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-full flex items-center justify-center font-black ${idx === 0 ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-600'} text-sm">
                ${idx + 1}
              </span>
              <span class="font-black text-xl text-slate-800">${s.name}</span>
            </div>
            <span class="font-bold text-slate-500 text-sm font-mono">${s.diff}</span>
          </div>
        `).join('');
      }

      if (currentRole === 'student') {
        const studentListContainer = document.getElementById('studentRankingList');
        const studentBadge = document.getElementById('studentBuzzCountBadge');
        const myRankBadge = document.getElementById('myRankBadge');

        studentBadge.textContent = `${rankedStudents.length} 人`;

        if (rankedStudents.length === 0) {
          studentListContainer.innerHTML = '<div class="text-center py-4 text-slate-400 font-bold text-xs">題目開放後，將即時顯示全班排名</div>';
        } else {
          const myIdx = rankedStudents.findIndex(s => s.id === myStudentId);
          if (myIdx !== -1) {
            myRankBadge.textContent = `你是第 ${myIdx + 1} 名！`;
          }

          studentListContainer.innerHTML = rankedStudents.map((s, idx) => `
            <div class="flex items-center justify-between p-2 rounded-xl ${s.id === myStudentId ? 'bg-indigo-50 border border-indigo-200' : 'bg-slate-50'}">
              <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full flex items-center justify-center font-bold text-xs ${idx === 0 ? 'bg-amber-400 text-white' : 'bg-slate-200 text-slate-600'}">
                  ${idx + 1}
                </span>
                <span class="font-bold text-slate-800 ${s.id === myStudentId ? 'text-indigo-600' : ''}">${s.name} ${s.id === myStudentId ? '(你)' : ''}</span>
              </div>
              <span class="text-xs font-mono text-slate-400">${idx === 0 ? '👑 第 1 名' : `第 ${idx + 1}`}</span>
            </div>
          `).join('');
        }
      }
    }

    function toggleBuzzState() {
      if (!isOpen) {
        openTimestamp = Date.now();
        sendBroadcast({ type: 'OPEN_BUZZ', openTime: openTimestamp });
        document.getElementById('toggleBuzzBtn').textContent = '🔒 鎖定按鈕';
        document.getElementById('toggleBuzzBtn').className = "px-8 py-4 bg-rose-500 hover:bg-rose-600 text-white font-black text-2xl rounded-2xl shadow-lg transition";
        isOpen = true;
      } else {
        sendBroadcast({ type: 'RESET_BUZZ' });
        document.getElementById('toggleBuzzBtn').textContent = '📢 開放搶答！';
        document.getElementById('toggleBuzzBtn').className = "px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-2xl rounded-2xl shadow-lg transition";
        isOpen = false;
      }
    }

    function resetBuzzers() {
      sendBroadcast({ type: 'RESET_BUZZ' });
      document.getElementById('toggleBuzzBtn').textContent = '📢 開放搶答！';
      document.getElementById('toggleBuzzBtn').className = "px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-2xl rounded-2xl shadow-lg transition";
      isOpen = false;
      rankedStudents = [];
      updateRankUI();
    }

    function studentPressBuzz() {
      if (!isOpen || hasPressed) return;
      hasPressed = true;
      playBeep(1000, 0.15);

      const pressTime = Date.now();
      const btn = document.getElementById('mainBuzzBtn');
      btn.disabled = true;
      btn.className = "buzz-btn w-64 h-64 md:w-72 md:h-72 rounded-full border-8 border-indigo-300 bg-indigo-500 text-white font-black text-3xl shadow-2xl flex flex-col items-center justify-center gap-2 overflow-hidden";
      document.getElementById('btnStatusText').textContent = '已搶答！';
      document.getElementById('studentFeedback').innerHTML = '<span class="text-indigo-600">已送出！請看下方排名 🎯</span>';

      sendBroadcast({
        type: 'STUDENT_BUZZ',
        id: myStudentId,
        name: userName,
        pressTime: pressTime
      });
    }

    function awardPoint() {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      playBeep(900, 0.3);
    }

    function openQrModal() {
      document.getElementById('qrModal').classList.remove('hidden');
      document.getElementById('qrModalRoomCode').textContent = roomCode;

      const container = document.getElementById('qrcodeContainer');
      container.innerHTML = '';

      const targetUrl = `https://chenyu-clc.github.io/buzzer/?room=${roomCode}`;
      new QRCode(container, {
        text: targetUrl,
        width: 180,
        height: 180,
        colorDark: "#1e1b4b",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const room = urlParams.get('room');
      if (room) {
        document.getElementById('roomCodeInput').value = room;
      }
    });
  </script>
</body>
</html>
