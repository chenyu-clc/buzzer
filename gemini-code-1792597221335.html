<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>課堂搶答系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .buzz-btn:active {
      transform: scale(0.95);
    }
    .pulse-glow {
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 45px rgba(34, 197, 94, 0.85); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-sky-50 to-indigo-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="bg-white/95 backdrop-blur border-b border-indigo-100 shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 bg-white rounded-2xl p-1 border border-indigo-100 flex items-center justify-center shadow-sm overflow-hidden">
          <img src="yu_logo.png" alt="Chen Yu 原創吉祥物" class="w-full h-full object-contain">
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-wide">課堂搶答系統</h1>
          <p class="text-xs text-indigo-600 font-bold tracking-wider">全班即時連線・毫秒裁判</p>
        </div>
      </div>
      <div id="connectionStatus" class="flex items-center gap-2 text-sm font-bold bg-amber-50 text-amber-700 px-3.5 py-1.5 rounded-full border border-amber-200">
        <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="connText">連線中...</span>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-1 flex flex-col justify-center">

    <!-- 1. 登入選單（首頁） -->
    <div id="loginView" class="max-w-md mx-auto w-full bg-white border border-indigo-100 rounded-3xl p-8 shadow-xl text-center">
      <div class="w-28 h-28 mx-auto mb-3 flex items-center justify-center">
        <img src="yu_logo.png" alt="Chen Yu 原創吉祥物" class="w-full h-full object-contain">
      </div>
      <h2 class="text-3xl font-black text-slate-800 mb-2">加入搶答教室</h2>
      <p class="text-slate-500 text-sm mb-6">輸入房間代碼與座號名字，立即開始搶答！</p>

      <div class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">房間代碼 (4 位數字)</label>
          <div class="flex gap-2">
            <input id="roomCodeInput" type="number" pattern="[0-9]*" placeholder="例如：8888" maxlength="4"
              class="w-full text-center tracking-widest text-3xl font-black border-2 border-indigo-200 rounded-2xl py-3 px-4 focus:outline-none focus:border-indigo-500 bg-slate-50 text-slate-800">
            <button onclick="randomRoomCode()" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold rounded-2xl border border-indigo-200 text-sm flex items-center justify-center">🎲 隨機</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">您的暱稱 / 座號姓名</label>
          <input id="userNameInput" type="text" placeholder="例如：05號 小明"
            class="w-full text-lg font-bold border-2 border-indigo-200 rounded-2xl py-3 px-4 focus:outline-none focus:border-indigo-500 bg-slate-50 text-slate-800">
        </div>

        <div class="pt-4 space-y-3">
          <button onclick="joinRoom('student')" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-2xl py-4 rounded-2xl shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
            我是學生，進入搶答！
          </button>
          <button onclick="joinRoom('teacher')" class="w-full bg-white hover:bg-slate-50 text-indigo-700 font-bold text-lg py-3 rounded-2xl border-2 border-indigo-200 transition">
            我是老師（開啟主持大螢幕）
          </button>
        </div>
      </div>
    </div>

    <!-- 2. 老師端控制面板 -->
    <div id="teacherView" class="hidden space-y-6">
      <div class="bg-white rounded-3xl p-6 border border-indigo-100 shadow-lg flex flex-wrap items-center justify-between gap-4">
        <div>
          <span class="text-xs font-bold text-slate-400 tracking-wider">搶答房間代碼</span>
          <div class="flex items-center gap-3">
            <span id="teacherRoomCode" class="text-5xl md:text-6xl font-black text-indigo-600 tracking-wider">----</span>
            <button onclick="openQrModal()" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-xl border border-indigo-200 text-sm flex items-center gap-1.5 shadow-sm">
              <span>📱</span> 投影 QR Code
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="resetBuzzers()" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-base transition">
            🔄 重置本題
          </button>
          <button id="toggleBuzzBtn" onclick="toggleBuzzState()" class="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-2xl rounded-2xl shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
            📢 開放搶答！
          </button>
        </div>
      </div>

      <!-- 在線學生狀態列 -->
      <div class="bg-white rounded-2xl p-4 border border-indigo-100 shadow-sm flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span class="text-sm font-black text-slate-700">👥 已在線學生：</span>
          <span id="onlineCountBadge" class="bg-indigo-100 text-indigo-700 font-black px-2.5 py-0.5 rounded-full text-sm">0 人</span>
        </div>
        <div id="onlineListNames" class="text-xs text-slate-500 font-medium flex gap-1 flex-wrap">
          等待學生加入中...
        </div>
      </div>

      <!-- 戰況與排行榜 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 第一名特寫展示 -->
        <div class="md:col-span-1 bg-gradient-to-b from-amber-50 to-orange-50 border-2 border-amber-200 rounded-3xl p-6 text-center flex flex-col justify-center items-center shadow-md">
          <span class="text-amber-600 font-black text-sm tracking-widest uppercase mb-1">👑 最先搶到者</span>
          <div id="firstPlaceName" class="text-4xl md:text-5xl font-black text-slate-800 my-4">等待搶答...</div>
          <div id="firstPlaceTime" class="text-xl font-bold text-amber-700">--</div>
          <button id="rewardBtn" onclick="awardPoint()" class="mt-4 hidden px-6 py-2 bg-amber-500 hover:bg-amber-600 text-white font-black text-lg rounded-xl shadow-md transition">
            🎉 加分獎勵！
          </button>
        </div>

        <!-- 即時榜單 -->
        <div class="md:col-span-2 bg-white rounded-3xl p-6 border border-indigo-100 shadow-lg">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
              <span>⚡ 即時搶答榜單</span>
              <span id="buzzCountBadge" class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-bold">0 人搶答</span>
            </h3>
            <span class="text-xs font-bold text-slate-400">毫秒高精度排序</span>
          </div>
          <div id="rankingList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
            <div class="text-center py-12 text-slate-400 font-bold">按上方「開放搶答」讓學生開始按鈕！</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 學生端畫面（按鈕 + 即時全班戰況榜） -->
    <div id="studentView" class="hidden flex flex-col items-center justify-center space-y-6 text-center max-w-lg mx-auto w-full">
      <div class="bg-white/80 backdrop-blur px-6 py-3 rounded-2xl border border-indigo-100 shadow
